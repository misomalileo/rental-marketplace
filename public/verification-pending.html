<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Required | Khomo Lathu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 500px;
      background: white;
      border-radius: 32px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h2 {
      color: #1e293b;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    p {
      color: #475569;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .email {
      background: #f1f5f9;
      padding: 0.5rem;
      border-radius: 60px;
      font-weight: 600;
      margin: 1rem 0;
      word-break: break-all;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(105deg, #FF8C42, #E67E22);
      color: white;
      padding: 0.7rem 1.5rem;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
      border: none;
      cursor: pointer;
    }
    .btn-outline {
      background: transparent;
      color: #FF8C42;
      border: 1px solid #FF8C42;
      margin-left: 0.5rem;
    }
    .btn-outline:hover {
      background: #FF8C42;
      color: white;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .resend-message {
      font-size: 0.8rem;
      margin-top: 1rem;
      color: #64748b;
    }
    .resend-error {
      color: #e74c3c;
    }
    .resend-success {
      color: #2ecc71;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📧</div>
    <h2>Verify Your Email Address</h2>
    <p>We've sent a verification link to:</p>
    <div class="email" id="userEmail">Loading...</div>
    <p>Please check your inbox (and spam folder) and click the link to complete your registration.</p>
    <button class="btn" id="resendBtn">Resend Verification Email</button>
    <button class="btn btn-outline" onclick="window.location.href='login.html'">Back to Login</button>
    <div id="resendMessage" class="resend-message"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    const userEmailSpan = document.getElementById('userEmail');
    if (email) {
      userEmailSpan.textContent = email;
    } else {
      userEmailSpan.textContent = 'your email address';
    }

    const resendBtn = document.getElementById('resendBtn');
    const resendMessageDiv = document.getElementById('resendMessage');

    resendBtn.addEventListener('click', async () => {
      if (!email) {
        resendMessageDiv.innerHTML = '<span class="resend-error">No email address found. Please try logging in again.</span>';
        return;
      }
      resendBtn.disabled = true;
      resendBtn.innerHTML = 'Sending...';
      try {
        const res = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
          resendMessageDiv.innerHTML = '<span class="resend-success">✓ Verification email resent. Check your inbox.</span>';
        } else {
          resendMessageDiv.innerHTML = '<span class="resend-error">' + (data.message || 'Failed to resend email.') + '</span>';
        }
      } catch (err) {
        resendMessageDiv.innerHTML = '<span class="resend-error">Network error. Please try again.</span>';
      } finally {
        resendBtn.disabled = false;
        resendBtn.innerHTML = 'Resend Verification Email';
        setTimeout(() => {
          resendMessageDiv.innerHTML = '';
        }, 5000);
      }
    });
  </script>
</body>
</html>
