<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Become a Landlord | Khomo Lathu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #1e293b;
    }
    .sub {
      color: #64748b;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: #334155;
    }
    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 28px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #FF8C42;
      box-shadow: 0 0 0 3px rgba(255,140,66,0.1);
    }
    button {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(105deg, #FF8C42, #E67E22);
      color: white;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      font-family: 'Poppins', sans-serif;
    }
    button:hover {
      opacity: 0.9;
    }
    .message {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 60px;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }
    .message.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #ef4444;
    }
    .message.success {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #22c55e;
    }
    .back-link {
      text-align: center;
      margin-top: 1.2rem;
    }
    .back-link a {
      color: #FF8C42;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-building"></i> Become a Landlord</h1>
    <p class="sub">Tell us about your business to start listing properties</p>
    <form id="landlordForm">
      <div class="form-group">
        <label><i class="fas fa-building"></i> Business Name</label>
        <input type="text" id="businessName" placeholder="e.g., Ghambi Properties" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-map-marker-alt"></i> Address</label>
        <input type="text" id="address" placeholder="Your physical address" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-phone-alt"></i> Phone Number</label>
        <input type="tel" id="phone" placeholder="0999 123 456" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-info-circle"></i> Bio / About</label>
        <textarea id="bio" rows="4" placeholder="Tell potential tenants about yourself and your properties..."></textarea>
      </div>
      <button type="submit"><i class="fas fa-check-circle"></i> Submit & Become Landlord</button>
    </form>
    <div id="message" class="message"></div>
    <div class="back-link">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script src="js/role-redirect.js"></script>
  <script>
    const form = document.getElementById('landlordForm');
    const messageDiv = document.getElementById('message');

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      setTimeout(() => { messageDiv.style.display = 'none'; }, 5000);
    }

    // FIX: page guard - not logged in -> login; already landlord/premium/admin -> go to THEIR dashboard
    (function guard() {
      const savedToken = localStorage.getItem('token');
      if (!savedToken) { window.location.replace('login.html'); return; }
      const savedRole = localStorage.getItem('role');
      if (savedRole && savedRole !== 'free') { KL.goToDashboard(savedRole); }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = localStorage.getItem('token');
      if (!token) {
        showMessage('You must be logged in.', 'error');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }

      const businessName = document.getElementById('businessName').value.trim();
      const address = document.getElementById('address').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const bio = document.getElementById('bio').value.trim();

      if (!businessName || !address || !phone) {
        showMessage('Please fill in all required fields.', 'error');
        return;
      }

      try {
        const res = await fetch('/api/users/become-landlord', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ businessName, address, phone, bio })
        });
        const data = await res.json();
        if (res.ok) {
          showMessage('You are now a landlord! Redirecting to dashboard...', 'success');
          // FIX: save the NEW token from the server (the old one still says "free") and the new role
          if (data.token) localStorage.setItem('token', data.token);
          const newRole = (data.user && data.user.role) || 'landlord';
          localStorage.setItem('role', newRole);
          setTimeout(() => { KL.goToDashboard(newRole); }, 2000);
        } else if (data.message === 'Invalid token' || res.status === 401) {
          // FIX: expired login -> back to login, not a confusing error
          KL.clearSession();
          showMessage('Your session expired. Please log in again.', 'error');
          setTimeout(() => { window.location.replace('login.html'); }, 1500);
        } else if (data.role && data.role !== 'free') {
          // FIX: already a landlord/premium user -> send them to their own dashboard
          localStorage.setItem('role', data.role);
          showMessage(data.message || 'You already have an upgraded account.', 'error');
          setTimeout(() => { KL.goToDashboard(data.role); }, 2000);
        } else {
          showMessage(data.message || 'Upgrade failed', 'error');
        }
      } catch (err) {
        showMessage('Network error', 'error');
      }
    });
  </script>
</body>
</html>
