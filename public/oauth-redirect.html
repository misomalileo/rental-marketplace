<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
  <script src="js/role-redirect.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const role = urlParams.get('role');

    if (token) {
      localStorage.setItem('token', token);
      localStorage.setItem('role', role);
      // FIX: remove the token from the address bar so it does not stay in the browser history
      window.history.replaceState({}, document.title, window.location.pathname);

      // FIX: confirm the real role with the server, then go to that role's own dashboard
      fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(res => {
          if (!res.ok) throw new Error('bad-token');
          return res.json();
        })
        .then(user => {
          KL.saveSession(token, user.role || role);
          // Redirect based on role: admin / premium / landlord / free each go to their own page
          KL.goToDashboard(user.role || role);
        })
        .catch(err => {
          if (err.message === 'bad-token') {
            KL.clearSession();
            window.location.replace('login.html?error=google-auth-failed');
          } else {
            // network problem: fall back to the role the server sent in the link
            KL.goToDashboard(role);
          }
        });
    } else {
      window.location.replace('login.html?error=no-token');
    }
  </script>
</head>
<body>
  <p>Authenticating... Please wait.</p>
</body>
</html>
