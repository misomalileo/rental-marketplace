<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Register | Khomo Lathu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .register-container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
      padding: 2rem;
      border: 1px solid #e2e8f0;
    }
    .logo { text-align: center; margin-bottom: 1rem; }
    .logo i { font-size: 3rem; background: linear-gradient(135deg, #FF8C42, #FFD966); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo h2 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.8rem; margin-top: 0.3rem; color: #1e293b; }

    .role-selector {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .role-card {
      flex: 1;
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 0.8rem 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-card i { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; color: #64748b; }
    .role-card span { font-size: 0.9rem; font-weight: 600; color: #1e293b; }
    .role-card small { display: block; font-size: 0.65rem; color: #64748b; margin-top: 0.2rem; }
    .role-card.active { background: linear-gradient(135deg, #FF8C42, #E67E22); border-color: transparent; }
    .role-card.active i, .role-card.active span, .role-card.active small { color: white; }
    .role-card:hover:not(.active) { background: #f1f5f9; transform: translateY(-2px); }

    .input-group { margin-bottom: 1rem; position: relative; }
    .input-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.8rem; color: #334155; }
    .input-group input {
      width: 100%;
      padding: 0.85rem 2.5rem 0.85rem 1.2rem;
      border: 1px solid #cbd5e1;
      border-radius: 32px;
      font-size: 0.9rem;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #FF8C42; box-shadow: 0 0 0 3px rgba(255,140,66,0.1); }
    .input-group input::placeholder { color: #94a3b8; }

    .password-toggle {
      position: absolute;
      right: 18px;
      bottom: 14px;
      cursor: pointer;
      color: #64748b;
      transition: color 0.2s;
    }
    .password-toggle:hover { color: #FF8C42; }

    .password-strength {
      font-size: 0.7rem;
      margin-top: 0.3rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .strength-item { display: inline-flex; align-items: center; gap: 4px; }
    .strength-item i { font-size: 0.7rem; }
    .strength-valid { color: #10b981; }
    .strength-invalid { color: #ef4444; }

    .register-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(105deg, #FF8C42, #E67E22);
      color: white;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.8rem;
      font-family: 'Poppins', sans-serif;
    }
    .register-btn:hover { opacity: 0.9; }
    .register-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0 1rem;
      color: #94a3b8;
      font-size: 0.75rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
    .divider span { margin: 0 0.8rem; }

    .social-buttons { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1rem; }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 0.7rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .google-btn { background: #ffffff; color: #3c4043; border: 1px solid #dadce0; }
    .google-btn svg { width: 20px; height: 20px; }
    .google-btn:hover { background: #f8f9fa; }

    .login-link { text-align: center; margin-top: 1rem; font-size: 0.8rem; color: #475569; }
    .login-link a { color: #FF8C42; font-weight: 600; text-decoration: none; }

    .message {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 60px;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }
    .message.error { background: #fee2e2; color: #b91c1c; border: 1px solid #ef4444; }
    .message.success { background: #dcfce7; color: #15803d; border: 1px solid #22c55e; }

    @media (max-width: 640px) { .register-container { padding: 1.5rem; } }
  </style>
</head>
<body>
<div class="register-container">
  <div class="logo"><i class="fas fa-crown"></i><h2>Join Khomo Lathu</h2></div>

  <div class="role-selector" id="roleSelector">
    <div class="role-card" data-role="free"><i class="fas fa-user"></i><span>Renter</span><small>Search & book</small></div>
    <div class="role-card" data-role="landlord"><i class="fas fa-building"></i><span>Landlord</span><small>List properties</small></div>
    <div class="role-card" data-role="premium_user"><i class="fas fa-crown"></i><span>Premium User</span><small>Early access & insights</small></div>
  </div>

  <form id="registerForm">
    <input type="hidden" id="roleInput" name="role" value="free">
    <div class="input-group">
      <label><i class="fas fa-user"></i> Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>
    </div>
    <div class="input-group">
      <label><i class="fas fa-envelope"></i> Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>
    <div class="input-group">
      <label><i class="fab fa-whatsapp"></i> WhatsApp Number</label>
      <input type="tel" id="phone" placeholder="265881535985" pattern="265[0-9]{9}" required>
      <small style="font-size: 0.7rem; color: #64748b;">Format: 265 followed by 9 digits (no spaces)</small>
    </div>
    <div class="input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      <span class="password-toggle" id="togglePassword"><i class="far fa-eye"></i></span>
      <div id="passwordStrength" class="password-strength">
        <span class="strength-item"><i class="fas fa-circle" id="lengthIcon"></i> 8+ chars</span>
        <span class="strength-item"><i class="fas fa-circle" id="upperIcon"></i> Uppercase</span>
        <span class="strength-item"><i class="fas fa-circle" id="lowerIcon"></i> Lowercase</span>
        <span class="strength-item"><i class="fas fa-circle" id="numberIcon"></i> Number</span>
      </div>
    </div>
    <div class="input-group">
      <label><i class="fas fa-check-circle"></i> Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" required>
      <span class="password-toggle" id="toggleConfirm"><i class="far fa-eye"></i></span>
    </div>
    <button type="submit" class="register-btn" id="registerBtn"><i class="fas fa-user-plus"></i> Create Account</button>
  </form>
  <div id="message" class="message"></div>

  <div class="divider"><span>or sign up with</span></div>
  <div class="social-buttons">
    <a id="googleSignupBtn" class="social-btn google-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      Continue with Google
    </a>
  </div>

  <div class="login-link">Already have an account? <a href="login.html">Log in</a></div>
</div>

<script>
  // Role selection
  const roleCards = document.querySelectorAll('.role-card');
  const roleInput = document.getElementById('roleInput');
  let selectedRole = 'free';

  function setActiveRole(role) {
    roleCards.forEach(card => {
      const cardRole = card.getAttribute('data-role');
      card.classList.toggle('active', cardRole === role);
    });
    roleInput.value = role;
    selectedRole = role;
    const googleBtn = document.getElementById('googleSignupBtn');
    if (googleBtn) googleBtn.href = `/api/auth/google?role=${selectedRole}`;
  }
  roleCards.forEach(card => {
    card.addEventListener('click', () => setActiveRole(card.getAttribute('data-role')));
  });
  setActiveRole('free');

  // Password strength & toggles
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const togglePassword = document.getElementById('togglePassword');
  const toggleConfirm = document.getElementById('toggleConfirm');

  togglePassword.addEventListener('click', () => {
    const type = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = type;
    togglePassword.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
  });
  toggleConfirm.addEventListener('click', () => {
    const type = confirmInput.type === 'password' ? 'text' : 'password';
    confirmInput.type = type;
    toggleConfirm.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
  });

  const lengthIcon = document.getElementById('lengthIcon');
  const upperIcon = document.getElementById('upperIcon');
  const lowerIcon = document.getElementById('lowerIcon');
  const numberIcon = document.getElementById('numberIcon');

  function updateStrength() {
    const pwd = passwordInput.value;
    const hasLength = pwd.length >= 8;
    const hasUpper = /[A-Z]/.test(pwd);
    const hasLower = /[a-z]/.test(pwd);
    const hasNumber = /[0-9]/.test(pwd);
    lengthIcon.className = hasLength ? 'fas fa-check-circle strength-valid' : 'fas fa-circle strength-invalid';
    upperIcon.className = hasUpper ? 'fas fa-check-circle strength-valid' : 'fas fa-circle strength-invalid';
    lowerIcon.className = hasLower ? 'fas fa-check-circle strength-valid' : 'fas fa-circle strength-invalid';
    numberIcon.className = hasNumber ? 'fas fa-check-circle strength-valid' : 'fas fa-circle strength-invalid';
  }
  passwordInput.addEventListener('input', updateStrength);
  updateStrength();

  // Form submission
  const form = document.getElementById('registerForm');
  const registerBtn = document.getElementById('registerBtn');
  const messageDiv = document.getElementById('message');

  function showMessage(text, type) {
    messageDiv.textContent = text;
    messageDiv.className = `message ${type}`;
    messageDiv.style.display = 'block';
    setTimeout(() => { messageDiv.style.display = 'none'; }, 6000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = passwordInput.value;
    const confirm = confirmInput.value;
    const role = roleInput.value;

    if (!name || !email || !phone || !password || !confirm) {
      showMessage('Please fill in all fields.', 'error');
      return;
    }
    if (!/^265[0-9]{9}$/.test(phone)) {
      showMessage('Phone number must be 265 followed by 9 digits (e.g., 265881535985).', 'error');
      return;
    }
    if (password !== confirm) {
      showMessage('Passwords do not match.', 'error');
      return;
    }
    const hasLength = password.length >= 8;
    const hasUpper = /[A-Z]/.test(password);
    const hasLower = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    if (!hasLength || !hasUpper || !hasLower || !hasNumber) {
      showMessage('Password must be at least 8 characters, include uppercase, lowercase and a number.', 'error');
      return;
    }

    registerBtn.disabled = true;
    registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, password, role })
      });
      const data = await res.json();
      if (res.ok) {
        showMessage('Account created! 📧 Please check your email (including spam) to verify your account.', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 3000);
      } else {
        showMessage(data.message || 'Registration failed. Check console for details.', 'error');
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    } catch (err) {
      showMessage('Network error. Please try again.', 'error');
      registerBtn.disabled = false;
      registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
    }
  });
</script>
</body>
</html>
